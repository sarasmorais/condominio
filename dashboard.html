<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Gestão de Aluguéis</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <i class="fas fa-building"></i>
            <span>Sistema de Gestão de Aluguéis</span>
        </div>
        <div class="user-info">
            <span class="user-name" id="userName">Carregando...</span>
            <button class="logout-btn" id="logoutBtn">Sair</button>
        </div>
    </nav>
    
    <div class="container">
        <div class="dashboard-header">
            <h1>Dashboard</h1>
            <p>Bem-vindo ao seu painel de controle</p>
        </div>
        
        <div class="cards-container">
            <!-- Card de Pagamento do Aluguel -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-home"></i>
                    </div>
                    <div class="card-title">Pagamento do Aluguel</div>
                </div>
                <div class="card-status" id="rentStatus">
                    <div class="status-icon status-pending"></div>
                    <div class="status-text status-pending-text">Em aberto</div>
                </div>
            </div>
            
            <!-- Card de Pagamento do Condomínio -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="card-title">Pagamento do Condomínio</div>
                </div>
                <div class="card-status" id="condoStatus">
                    <div class="status-icon status-pending"></div>
                    <div class="status-text status-pending-text">Em aberto</div>
                </div>
            </div>
            
            <!-- Card de Desconto no Aluguel -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-percent"></i>
                    </div>
                    <div class="card-title">Desconto no Aluguel</div>
                </div>
                <div class="discount-value" id="discountValue">0%</div>
                <div class="discount-label">de desconto aplicado neste mês</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://sqmjecuweeqbgbcqoyrt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // substitua pela chave completa
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    if (!currentUser) {
        window.location.href = 'index.html';
    }

    async function carregarDadosUsuario() {
        const { data, error } = await supabase
            .from('gestao-alugueis')
            .select('*')
            .eq('email', currentUser.email)
            .single();

        if (error || !data) {
            console.error('Erro ao carregar dados do usuário:', error);
            return;
        }

        sessionStorage.setItem('currentUser', JSON.stringify(data));
        atualizarDashboard(data);
    }

    function atualizarDashboard(user) {
        // Nome
        document.getElementById('userName').textContent = user.name;

        // Aluguel
        const rentStatusIcon = document.querySelector('#rentStatus .status-icon');
        const rentStatusText = document.querySelector('#rentStatus .status-text');
        if (user.rent_status) {
            rentStatusIcon.classList.remove('status-pending');
            rentStatusIcon.classList.add('status-paid');
            rentStatusText.classList.remove('status-pending-text');
            rentStatusText.classList.add('status-paid-text');
            rentStatusText.textContent = 'Pago';
        } else {
            rentStatusText.textContent = 'Em aberto';
        }

        // Condomínio
        const condoStatusIcon = document.querySelector('#condoStatus .status-icon');
        const condoStatusText = document.querySelector('#condoStatus .status-text');
        if (user.condo_status) {
            condoStatusIcon.classList.remove('status-pending');
            condoStatusIcon.classList.add('status-paid');
            condoStatusText.classList.remove('status-pending-text');
            condoStatusText.classList.add('status-paid-text');
            condoStatusText.textContent = 'Pago';
        } else {
            condoStatusText.textContent = 'Em aberto';
        }

        // Desconto
        document.getElementById('discountValue').textContent = `${user.rent_discount}%`;
    }

    document.getElementById('logoutBtn').addEventListener('click', function () {
        sessionStorage.removeItem('currentUser');
        window.location.href = 'index.html';
    });

    carregarDadosUsuario();
</script>

</body>
</html>
